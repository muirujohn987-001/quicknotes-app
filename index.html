<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickNotes | Your Personal Note Manager</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- App header -->
    <header>
        <h1>QuickNotes</h1>
        <p>Your thoughts, organized in one place.</p>
    </header>

    <main>
        <!-- Section 1: Add a note -->
        <section id="add-note-section">
            <h2>Add a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note text</label>

                    <input
                        type="text"
                        id="note-input"
                        placeholder="What would you like to remember?"
                        maxlength="1000"
                    >
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>

                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <!-- Section 2: Display and search notes -->
        <section id="notes-section">
            <h2>Your notes</h2>

            <label for="search-input">Search your notes</label>

            <input
                type="search"
                id="search-input"
                placeholder="Search by note text..."
            >

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <!-- App footer -->
    <footer>
        <p>QuickNotes &copy; 2026 | Keep your thoughts organized.</p>
    </footer>
</body>
</html>
